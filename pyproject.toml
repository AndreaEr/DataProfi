[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataprofi"
version = "1.0.0"
description = "Data quality profiling, automated cleaning, and PostgreSQL index recommendation library"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Andrea" }
]
maintainers = [
    { name = "Andrea" }
]
keywords = ["data-quality", "data-profiling", "database", "indexing", "postgresql", "machine-learning", "data-cleaning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
    "thefuzz[speedup]>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.scripts]
dataprofi = "dataprofi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dataprofi"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
